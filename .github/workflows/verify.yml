name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -B tests/test_kokoro_cache_guard.py
      - run: npm run audit:content
      - run: npm run audio:audit
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: iPad touch and application-window checks
        env:
          PLAYWRIGHT_CHANNEL: chromium
          IPAD_TEST_URL: http://127.0.0.1:5173
          PWA_TEST_URL: http://127.0.0.1:5173
          IPAD_LAYOUT_TEST_URL: http://127.0.0.1:5173
          ZOO_TEST_URL: http://127.0.0.1:5173
          NARRATION_TEST_URL: http://127.0.0.1:5173
          ZOO_NARRATION_TEST_URL: http://127.0.0.1:5173
          PROMPT_TEST_URL: http://127.0.0.1:5173
          LESSON_PROMPT_TEST_URL: http://127.0.0.1:5173
        run: |
          node scripts/serve-lan.mjs > /tmp/kidchinese-lan.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5173/ > /dev/null
          npx playwright test tests/ipad-touch.spec.ts --workers=1 --reporter=line --output=test-results/ipad-touch
          npx playwright test tests/narration-browser.spec.ts --workers=1 --reporter=line --output=test-results/narration
          npx playwright test tests/zoo-narration.spec.ts --workers=1 --reporter=line --output=test-results/zoo-narration
          PROMPT_TEST_ENGINE=chromium npx playwright test tests/prompt-navigation.spec.ts --workers=1 --reporter=line --output=test-results/prompts-chromium
          PROMPT_TEST_ENGINE=webkit npx playwright test tests/prompt-navigation.spec.ts --workers=1 --reporter=line --output=test-results/prompts-webkit
          LESSON_PROMPT_ENGINE=chromium npx playwright test tests/lesson-prompts.spec.ts --workers=1 --reporter=line --output=test-results/lesson-prompts-chromium
          LESSON_PROMPT_ENGINE=webkit npx playwright test tests/lesson-prompts.spec.ts --workers=1 --reporter=line --output=test-results/lesson-prompts-webkit
          npx playwright test tests/zoo.spec.ts --workers=1 --reporter=line --output=test-results/zoo
          PWA_TEST_ENGINE=chromium npx playwright test tests/pwa.spec.ts --workers=1 --reporter=line --output=test-results/pwa-chromium
          PWA_TEST_ENGINE=webkit npx playwright test tests/pwa.spec.ts --workers=1 --reporter=line --output=test-results/pwa-webkit
          IPAD_LAYOUT_ENGINE=chromium npx playwright test tests/ipad-layout.spec.ts --workers=1 --reporter=line --output=test-results/layout-chromium
          IPAD_LAYOUT_ENGINE=webkit npx playwright test tests/ipad-layout.spec.ts --workers=1 --reporter=line --output=test-results/layout-webkit
          IPAD_LAYOUT_ENGINE=chromium IPAD_LAYOUT_SAFE_INSETS=20 npx playwright test tests/ipad-layout.spec.ts --grep 'Safari usable landscape' --workers=1 --reporter=line --output=test-results/layout-safe-insets
